name: Setup Test Environment
description: >
  Shared CI setup: PHP toolchain + composer install + app bootstrap, node + npm
  install, and the Vite asset build. build_js implies install_js and requires
  build_php: the lattice vite plugin discovers component packages from
  vendor/composer/installed.json, so building without vendor/ silently drops
  their chunks from the bundle.

inputs:
  php_version:
    description: PHP version passed to setup-php.
    default: '8.4'
  build_php:
    description: Install PHP, composer dependencies, and bootstrap the app (.env, app key).
    default: 'true'
  install_js:
    description: Install node and npm dependencies.
    default: 'false'
  build_js:
    description: Build the Vite assets (implies install_js, requires build_php).
    default: 'false'
  enable_playwright:
    description: Install the Playwright chromium browser with its system deps.
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.build_php == 'true'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:v2
        coverage: none

    - name: Resolve composer cache directory
      if: inputs.build_php == 'true'
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - if: inputs.build_php == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ inputs.php_version }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-${{ inputs.php_version }}-

    - if: inputs.build_php == 'true'
      shell: bash
      run: composer install --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

    - name: Prepare Application
      if: inputs.build_php == 'true'
      shell: bash
      run: |
        cp .env.example .env
        php artisan package:discover --ansi
        php artisan key:generate

    - if: inputs.install_js == 'true' || inputs.build_js == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '22'
        cache: npm

    # `npm install`, not `npm ci`: the committed lockfile is generated on macOS
    # and has never carried the linux-only optional packages the wasm fallbacks
    # of rolldown and tailwind oxide pull in. `npm ci` rejects that as out of
    # sync; install resolves the missing optional deps itself.
    - if: inputs.install_js == 'true' || inputs.build_js == 'true'
      shell: bash
      run: npm install --no-audit --no-fund

    - name: Build Assets
      if: inputs.build_js == 'true'
      shell: bash
      run: npm run build

    - name: Resolve Playwright version
      if: inputs.enable_playwright == 'true'
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.enable_playwright == 'true'
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright browser and system deps
      if: inputs.enable_playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system deps only
      if: inputs.enable_playwright == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
